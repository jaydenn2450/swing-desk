<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swing Desk — Daily Scan</title>
<style>
:root{--bg0:#0a0e17;--bg1:#111827;--bg2:#141c2b;--bg3:#1a2332;--bd:#1e2d3d;--t1:#e2e8f0;--t2:#8899aa;--t3:#556677;
--grn:#10b981;--grnG:rgba(16,185,129,.15);--red:#ef4444;--redG:rgba(239,68,68,.15);--ylw:#f59e0b;--ylwG:rgba(245,158,11,.15);
--blu:#3b82f6;--bluG:rgba(59,130,246,.15);--pur:#8b5cf6;--purG:rgba(139,92,246,.15);--cyn:#06b6d4;--org:#f97316;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg0);color:var(--t1);font-family:'Segoe UI',system-ui,sans-serif;padding:16px}
.wrap{max-width:1560px;margin:0 auto}
.mono{font-family:Consolas,'JetBrains Mono',monospace}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 20px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--bd);border-radius:12px;margin-bottom:12px}
.hdr h1{font-size:19px}.hdr h1 span{color:var(--grn)}
.asof{font-size:11px;color:var(--t3)}
.regime{padding:6px 16px;border-radius:8px;font-weight:800;font-size:13px;letter-spacing:1px}
.RISK_ON{background:var(--grnG);color:var(--grn)}.CAUTION{background:var(--ylwG);color:var(--ylw)}.RISK_OFF{background:var(--redG);color:var(--red)}
.riskoff{margin:14px 0;padding:12px 16px;border-radius:8px;border-left:4px solid var(--red);background:var(--redG);color:var(--red);font-family:Consolas,monospace;font-size:13px}
.riskoff.HALF_SIZE{border-left-color:var(--ylw);background:var(--ylwG);color:var(--ylw)}
.riskoff.NO_ADDS{border-left-color:var(--red);background:var(--redG);color:var(--red)}
.riskoff-sub{margin-top:6px;font-size:11.5px;color:var(--t2);font-weight:400;letter-spacing:0}
.zone.STRESS{background:var(--redG);color:var(--red)}.zone.WIDENING{background:var(--ylwG);color:var(--ylw)}.zone.CALM{background:var(--grnG);color:var(--grn)}
.regimeedge{margin:10px 0;padding:10px 14px;border-radius:8px;border-left:4px solid var(--blu);background:var(--bluG);color:var(--blu);font-family:Consolas,monospace;font-size:12.5px}
.regimeedge.strong{border-left-color:var(--grn);background:var(--grnG);color:var(--grn)}
.regimeedge.weak{border-left-color:var(--red);background:var(--redG);color:var(--red)}
.regimeedge.neutral{border-left-color:var(--blu);background:var(--bluG);color:var(--blu)}
.regimeedge-sub{margin-top:4px;font-size:11px;color:var(--t2);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:9px 20px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--t2);cursor:pointer}
.tab.on{background:var(--bluG);border-color:var(--blu);color:var(--blu)}
.searchrow{display:flex;gap:10px;margin-bottom:12px}
#search,#flow-search{flex:1;padding:12px 18px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;color:var(--t1);font-family:Consolas,monospace;font-size:15px;font-weight:600;text-transform:uppercase;outline:none}
#search:focus,#flow-search:focus{border-color:var(--blu);box-shadow:0 0 0 3px var(--bluG)}
.hint{font-size:10px;color:var(--t3);align-self:center;max-width:300px}
.mkt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.mc{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:11px 13px}
.mcl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:4px}
.mcv{font-size:17px;font-weight:800}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);margin:18px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tgl{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.tgl button{background:var(--bg2);border:0;color:var(--t2);font-size:10px;font-weight:700;padding:4px 12px;cursor:pointer;letter-spacing:1px}
.tgl button.on{background:var(--blu);color:#fff}
.rot{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:4px}
.rotbox{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.rotbox h4{font-size:10px;letter-spacing:1px;margin-bottom:8px}
.rotbox.leading h4{color:var(--grn)}.rotbox.weakening h4{color:var(--ylw)}.rotbox.improving h4{color:var(--blu)}.rotbox.lagging h4{color:var(--red)}
.rchip{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-family:Consolas,monospace;margin:2px;border:1px solid var(--bd)}
.rchip.leading{color:var(--grn);background:var(--grnG)}.rchip.weakening{color:var(--ylw);background:var(--ylwG)}
.rchip.improving{color:var(--blu);background:var(--bluG)}.rchip.lagging{color:var(--red);background:var(--redG)}
.sigbrowser{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.siggroup{margin-bottom:10px}.siggroup:last-child{margin-bottom:0}
.sgh{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px}
.sgh b{color:var(--t1)} .sgh .cnt{color:var(--t3);font-weight:400;margin-left:6px}
.tchip{display:inline-block;padding:3px 9px;margin:2px;border:1px solid var(--bd);border-radius:6px;font-family:Consolas,monospace;font-size:11px;cursor:pointer;background:var(--bg0)}

.tchip.bull{border-color:rgba(16,185,129,.35)} .tchip.bear{border-color:rgba(239,68,68,.35)}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card.focus{border-color:rgba(16,185,129,.4)}
.tk{font-size:22px;font-weight:800;cursor:pointer}.tk:hover{color:var(--blu)}
.px{font-size:15px;color:var(--t2);margin-left:8px}
.chkscore{font-family:Consolas,monospace;font-size:13px;font-weight:800;color:var(--ylw);margin-left:10px}
.chartbtn{margin-left:10px;padding:3px 10px;border-radius:6px;background:var(--bluG);border:1px solid rgba(59,130,246,.4);color:var(--blu);font-size:10px;font-weight:800;cursor:pointer}
.tagpill{float:right;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;margin-left:6px}
.tag-MOMENTUM_BUILDING{background:var(--ylwG);color:var(--ylw)}
.tag-WATCH{background:var(--bluG);color:var(--blu)}.tag-TRANSITION{background:rgba(255,255,255,.07);color:var(--t2)}.tag-WEAK{background:var(--redG);color:var(--red)}
.setup{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px}
.BASE_READY,.BREAKOUT{background:var(--grnG);color:var(--grn)}.MOMENTUM{background:var(--bluG);color:var(--blu)}
.BASE_BUILDING{background:var(--ylwG);color:var(--ylw)}.PULLBACK{background:var(--purG);color:var(--pur)}
.EXTENDED,.DOWNTREND{background:var(--redG);color:var(--red)}.CONSOLIDATING,.NONE{background:rgba(255,255,255,.06);color:var(--t2)}
.POST_EVENT_DRIFT{background:rgba(249,115,22,.16);color:var(--org)}
.chks{margin:10px 0 4px}
.chk{display:inline-block;padding:2px 8px;margin:2px;border-radius:5px;font-family:Consolas,monospace;font-size:9.5px;font-weight:700;letter-spacing:.5px}
.chk.on{background:var(--grnG);color:var(--grn);border:1px solid rgba(16,185,129,.3)}
.chk.off{background:var(--bg0);color:var(--t3);border:1px solid var(--bd)}
.thesis{margin-top:10px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.65;color:var(--t1)}
.thesis.INTACT{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.3)}
.thesis.WEAKENING,.thesis.NEUTRAL{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3)}
.thesis.BROKEN{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3)}
.thesis b.v{letter-spacing:.5px}
.thesis.INTACT b.v{color:var(--grn)}.thesis.WEAKENING b.v,.thesis.NEUTRAL b.v{color:var(--ylw)}.thesis.BROKEN b.v{color:var(--red)}
.srow{display:flex;justify-content:space-between;font-size:11px;margin:5px 0 2px;color:var(--t2)}
.sbar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.sfill{height:100%;border-radius:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.kvi{background:var(--bg0);border-radius:7px;padding:8px 10px}
.kvl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.kvv{font-size:14px;font-weight:700}
.plan{margin-top:10px;background:var(--bg0);border:1px solid var(--bd);border-radius:9px;padding:11px 13px}
.plan h5{font-size:10px;letter-spacing:1px;color:var(--cyn);margin-bottom:7px}
.lvl{display:flex;justify-content:space-between;font-size:11px;font-family:Consolas,monospace;padding:2px 0;color:var(--t2)}
.lvl b{color:var(--t1)}
.lvl.up b{color:var(--grn)} .lvl.dn b{color:var(--red)}
.lvl .lab{color:var(--t3);font-size:10px}
.watchli{font-size:10.5px;color:var(--t2);margin-top:6px;line-height:1.6}
.ibkr{margin-top:10px;padding:10px;background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.25);border-radius:8px;font-size:11px;line-height:1.7}
.ibkr b{color:var(--cyn)}
.ftr{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--t3);font-family:Consolas,monospace}
.ftr .ok{color:var(--grn)} .ftr .star{color:var(--ylw)}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);background:var(--bg3)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(255,255,255,.02);cursor:pointer}
.wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.verdict{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:800;float:right}
.HOLDING{background:var(--grnG);color:var(--grn)}.WARNING{background:var(--ylwG);color:var(--ylw)}.BROKEN{background:var(--redG);color:var(--red)}.NO_DATA{background:rgba(255,255,255,.06);color:var(--t2)}
.reasons{font-size:11px;margin-top:8px;line-height:1.7}
.reasons .neg{color:var(--red)}.reasons .pos{color:var(--grn)}
.eday{margin-bottom:10px}
.edate{font-size:11px;font-weight:700;color:var(--blu);margin-bottom:4px}
.echip{display:inline-block;background:var(--bg0);border:1px solid var(--bd);border-radius:6px;padding:3px 9px;margin:2px;font-size:11px;cursor:pointer}
.echip b{color:var(--t1)}.echip span{color:var(--t3);font-size:10px}
.macro{display:flex;gap:8px;flex-wrap:wrap}
.mchip{background:var(--purG);border:1px solid rgba(139,92,246,.3);color:var(--pur);border-radius:6px;padding:3px 10px;font-size:11px}
.envgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
.env{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px}
.env h3{font-size:13px;letter-spacing:1px;margin-bottom:10px}
.zone{padding:3px 12px;border-radius:6px;font-size:11px;font-weight:800;margin-left:8px}
.zone.COMPLACENT{background:var(--bluG);color:var(--blu)}.zone.NORMAL,.zone.LOW{background:var(--grnG);color:var(--grn)}
.zone.CAUTION,.zone.ELEVATED{background:var(--ylwG);color:var(--ylw)}.zone.STRESS,.zone.CRISIS,.zone.PANIC{background:var(--redG);color:var(--red)}
.envkv{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:10px 0}
.envc{font-size:12px;line-height:1.7;color:var(--t1);background:var(--bg0);border-radius:8px;padding:10px 12px;margin-top:8px}
.spark{margin-top:8px}
.flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:12px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg0);border-radius:9px;padding:9px 12px;margin-bottom:6px;border-left:3px solid var(--t3)}
.frow.bull{border-left-color:var(--grn)} .frow.bear{border-left-color:var(--red)}
.frow .l1{font-size:13px;font-weight:800}
.frow .l1 .cp{padding:1px 7px;border-radius:5px;font-size:11px;margin:0 6px}
.frow .l1 .cp.C{background:var(--grnG);color:var(--grn)} .frow .l1 .cp.P{background:var(--redG);color:var(--red)}
.frow .l2{font-size:10.5px;color:var(--t2);font-family:Consolas,monospace;margin-top:2px}
.frow .side{font-size:10px;font-weight:800}
.frow.bull .side{color:var(--grn)} .frow.bear .side{color:var(--red)}
.voloi{padding:1px 7px;border-radius:5px;background:var(--ylwG);color:var(--ylw);font-size:10px;font-weight:800;font-family:Consolas,monospace}
.tilt{font-size:11px;font-family:Consolas,monospace;color:var(--t2);margin-bottom:8px}
.ladder{margin-top:6px}
.lrow{display:grid;grid-template-columns:64px 1fr 110px 52px;gap:8px;align-items:center;padding:2px 0;font-family:Consolas,monospace;font-size:11.5px}
.lrow .k{text-align:right;color:var(--t2)}
.lrow.price .k{color:#fff;font-weight:800}
.lbarw{height:15px;position:relative;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}
.lbar{position:absolute;top:0;bottom:0;border-radius:2px}
.lbar.pos{background:linear-gradient(90deg,#0d9488,#10b981)} .lbar.neg{background:linear-gradient(90deg,#7c3aed,#4c1d95)}
.lbar.king{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.lrow .g{text-align:right;font-size:11px}
.lrow .g.pos{color:var(--grn)} .lrow .g.neg{color:var(--pur)} .lrow .g.king{color:var(--ylw);font-weight:800}
.doi{font-size:9.5px;text-align:center;border-radius:4px;padding:1px 3px}
.doi.up{background:var(--grnG);color:var(--grn)} .doi.dn{background:var(--redG);color:var(--red)}
.pricemark{border-top:1px dashed #fff;opacity:.85}
#wladd{width:150px;padding:9px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;color:var(--t1);font-family:Consolas,monospace;font-size:13px;text-transform:uppercase;outline:none}
.addbtn{padding:9px 18px;border-radius:9px;background:var(--grnG);border:1px solid rgba(16,185,129,.4);color:var(--grn);font-size:12px;font-weight:800;cursor:pointer}
.srcpill{font-size:9px;padding:2px 7px;border-radius:5px;margin-left:8px;letter-spacing:.5px}
.srcpill.file{background:var(--purG);color:var(--pur)} .srcpill.local{background:var(--bluG);color:var(--blu)}
.rmv{float:right;color:var(--t3);cursor:pointer;font-size:14px;padding:0 6px}
.rmv:hover{color:var(--red)}
.cfwrap{margin-top:10px;background:var(--bg0);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
.cfgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cfc{text-align:center;background:rgba(255,255,255,.02);border-radius:7px;padding:6px 4px}
.cfl{font-size:8px;letter-spacing:1px;color:var(--t3);margin-bottom:3px}
.cfv{font-size:12px;font-weight:800;font-family:Consolas,monospace}
.cfsum{text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;margin-top:6px}
#detail,#flow-detail{margin-bottom:14px}

.closebtn:hover{background:var(--redG);border-color:rgba(239,68,68,.5);color:var(--red)}

.chg h3{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--t3);margin-bottom:8px}
.chg .row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;line-height:1.9}

.chg .pill{display:inline-block;padding:2px 8px;border-radius:5px;font-family:Consolas,monospace;font-size:10.5px;font-weight:700;margin:1px 3px 1px 0;cursor:pointer}

.chg .rrdn{background:var(--ylwG);color:var(--ylw);border:1px solid rgba(245,158,11,.3)}
.chg .quiet{color:var(--t3);font-style:italic;font-size:11px}
.foot{margin-top:22px;padding:12px;text-align:center;font-size:10px;color:var(--t3);border-top:1px solid var(--bd);line-height:1.6}

.rotnote{font-size:10px;color:var(--t3);margin-top:6px}

<body>
<div class="wrap" id="app"></div>
<script>
const R = /*__REPORT__*/null;
const E = /*__ENRICH__*/null;
const pc = x => x==null?'—':(x>0?'+':'')+x+'%';
const fmt$ = x => x>=1e6? '$'+(x/1e6).toFixed(1)+'M' : '$'+(x/1e3).toFixed(1)+'K';
const barColor = v => v>=70?'var(--grn)':v>=45?'var(--ylw)':'var(--red)';
const AGO = a => a===0?'today':a===1?'1d ago':a<=5?a+'d ago':(Math.round(a/5)+'w ago');
let rotTF='daily';
const BUILD = (R.as_of||'').replace(/[^0-9]/g,'');
function openChart(t){ window.open('chart.html?v='+BUILD+'#'+(t||'').toUpperCase().trim(),'_blank'); }
/* ---------- cards ---------- */
function scoreBars(sc){
  const keys=[['composite','COMPOSITE'],['trend','Trend'],['relative_strength','Rel Strength'],['participation','Volume'],['structure','Structure'],['momentum','Momentum']];
  return keys.map(([k,l])=>{const v=sc[k]??0;
    return `<div class="srow"><span>${l}</span><span class="mono">${v}</span></div>
    <div class="sbar"><div class="sfill" style="width:${v}%;background:${barColor(v)}"></div></div>`;}).join('');
}
function checklistChips(r){const c=r.checklist; if(!c) return '';
  return `<div class="chks">${Object.entries(c.items).map(([k,v])=>`<span class="chk ${v?'on':'off'}">${k}</span>`).join('')}</div>`;}
function rotChip(rot){ if(!rot) return '';
  const wk = rot.weekly_quad && rot.weekly_quad!==rot.quad ? ` · wk:${rot.weekly_quad}` : '';
  return `<span class="rchip ${rot.quad}">${rot.etf} ${rot.name} · ${rot.quad.toUpperCase()}${wk}</span>`;}
function ibkrBlock(t){const e=(E&&E[t]); if(!e) return '';
  const rows=[];
  if(e.option_vol_ratio!=null) rows.push(`Options volume <b>${e.option_vol_ratio}×</b> avg${e.option_vol_ratio>=2?' — <b>UNUSUAL</b>':''}`);
  if(e.put_call!=null) rows.push(`P/C today: <b>${e.put_call}</b>`);
  if(e.iv!=null) rows.push(`IV <b>${e.iv}%</b>${e.iv_pctile_52w!=null?` · 52w %ile <b>${e.iv_pctile_52w}</b>`:''}`);
  if(e.note) rows.push(e.note);
  return `<div class="ibkr"><b>IBKR LIVE</b> — ${rows.join('<br>')}</div>`;}
function optVerdict(o,e){
  let s=0, why=[];
  const ft=(o.flow_tilt||{}).read;
  if(ft==='BULLISH'){s+=2;why.push('premium flow buying calls / selling puts');}

function confluence(t){

  const capBadge=k.sector_capped?` <span style="color:var(--ylw);font-size:9.5px" title="3rd+ in sector — demoted by sector cap">↓SC</span>`:'';
  return `<tr onclick="openDetail('${t}')"><td class="mono">${i+1}</td><td><b>${t}</b>${capBadge}${r.sector?` <span style="color:var(--t3);font-size:10px">${r.sector}</span>`:''}</td><td class="mono">$${r.close}</td>

function changesBlock(){
  const c=R.changes; if(!c) return '';
  if(c.error) return `<div class="chg"><h3>SINCE LAST SCAN</h3><div class="quiet">diff unavailable: ${c.error}</div></div>`;
  const pill=(t,cls)=>`<span class="pill ${cls}" onclick="openDetail('${t}')">${t}</span>`;
  const nothing = !c.top3_added.length && !c.top3_removed.length && !c.ranked_added.length
               && !c.ranked_removed.length && !c.setup_flips.length && !c.rr_flips.length && !c.gate_breaks.length;
  if(nothing) return `<div class="chg"><h3>SINCE LAST SCAN — ${c.prev_as_of||'—'}</h3>
    <div class="quiet">no changes — same top-3, same ranked names, same setups and gates. Multi-week trend & RS windows rarely reshuffle in one session.</div></div>`;
  const rows=[];
  if(c.top3_added.length||c.top3_removed.length){
    rows.push(`<div><span class="lab">TOP-3</span>
      ${c.top3_added.map(t=>pill(t,'add')).join('')}
      ${c.top3_removed.map(t=>pill(t,'rem')).join('')}</div>`);
  }
  if(c.ranked_added.length||c.ranked_removed.length){
    rows.push(`<div><span class="lab">RANKED</span>
      ${c.ranked_added.map(t=>`<span class="pill add" onclick="openDetail('${t}')" title="promoted in">+${t}</span>`).join('')}
      ${c.ranked_removed.map(t=>`<span class="pill rem" onclick="openDetail('${t}')" title="dropped out">−${t}</span>`).join('')}</div>`);
  }
  if(c.setup_flips.length){
    rows.push(`<div><span class="lab">SETUP FLIPS</span>
      ${c.setup_flips.map(x=>`<span class="pill flip" onclick="openDetail('${x.t}')" title="${x.prev} → ${x.now}">${x.t} ${x.prev.replace(/_/g,' ')}→${x.now.replace(/_/g,' ')}</span>`).join('')}</div>`);
  }
  if(c.rr_flips.length){
    rows.push(`<div><span class="lab">R:R</span>
      ${c.rr_flips.map(x=>{const cls=x.now==='OK'?'rrup':'rrdn'; return `<span class="pill ${cls}" onclick="openDetail('${x.t}')" title="${x.prev} → ${x.now}">${x.t} ${x.prev}→${x.now}</span>`;}).join('')}</div>`);
  }
  if(c.gate_breaks.length){
    rows.push(`<div><span class="lab">GATE BREAKS</span>
      ${c.gate_breaks.map(x=>`<span class="pill brk" onclick="openDetail('${x.t}')" title="failed a gate — removed from ranked">${x.t}</span>`).join('')}</div>`);
  }
  return `<div class="chg"><h3>🔄 SINCE LAST SCAN — ${c.prev_as_of||'—'}</h3>
    <div class="row">${rows.join('')}</div></div>`;
}

function sparkSVG(xs,w,h,color){
  if(!xs||xs.length<2) return '';
  const mn=Math.min(...xs),mx=Math.max(...xs),rg=(mx-mn)||1;
  const pts=xs.map((v,i)=>`${(i/(xs.length-1)*w).toFixed(1)},${(h-4-(v-mn)/rg*(h-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

function flowRow(f){
  const cls=f.bullish?'bull':f.bearish?'bear':'';
  const sideTxt=f.side==='ASK'?'BOUGHT @ ASK':f.side==='BID'?'SOLD @ BID':'MID';
  return `<div class="frow ${cls}">

    <div style="text-align:right"><div class="side">${sideTxt}</div>
    ${f.voloi&&f.voloi>=2?`<span class="voloi">Vol/OI ${f.voloi}×</span>`:''}</div></div>`;
}
function ladderRows(o){
  if(!(o.ladder||[]).length) return '';
  const maxAbs=Math.max(...o.ladder.map(r=>Math.abs(r.gex)))||1;
  const pos=o.ladder.filter(r=>r.gex>0);
  const kingK=pos.length?pos.reduce((a,b)=>b.gex>a.gex?b:a).k:null;
  let html='', priceDrawn=false;
  o.ladder.forEach(r=>{
    if(!priceDrawn && o.spot!=null && r.k<=o.spot){
      html+=`<div class="lrow price pricemark"><div class="k">${o.spot}</div><div style="font-size:9px;color:#fff;letter-spacing:2px">◄ PRICE</div><div class="g"></div><div></div></div>`;
      priceDrawn=true;}
    const w=Math.max(2,Math.abs(r.gex)/maxAbs*100);
    const cls=r.k===kingK?'king':(r.gex>=0?'pos':'neg');
    const doi=r.doi==null?'':`<span class="doi ${r.doi>=0?'up':'dn'}">${r.doi>0?'+':''}${r.doi}%</span>`;
    html+=`<div class="lrow"><div class="k">${r.k}</div>
      <div class="lbarw"><div class="lbar ${cls}" style="left:0;width:${w}%"></div></div>
      <div class="g ${cls}">${r.gex>=0?'':'−'}${fmt$(Math.abs(r.gex))}${r.k===kingK?' ★':''}</div><div>${doi}</div></div>`;
  });
  return `<div class="ladder">${html}</div>`;
}

function isComplete(t){
  const r=R.results[t];
  if(!r) return false;
  if(r.status==='INSUFFICIENT_HISTORY') return true;      // nothing more to fetch
  if(!r.risk) return true;                                 // no tradable levels anyway
  const o=(R.options||{})[t];
  return !!(r.fa && !r.fa.error) && !!(o && !o.error);
}

function renderDetail(t,note){
  const host=document.getElementById('detail');
  host.innerHTML=`<div class="sec"> ${t} — FULL SIGNAL CARD
      <button class="chartbtn" onclick="openChart('${t}')">📈 CHART ↗</button>
      <button class="closebtn" onclick="closeDetail()" title="close search result">✕ CLOSE</button>
      ${note?`<span style="font-size:10px;color:var(--t3);letter-spacing:0">${note}</span>`:''}</div>`+bigCard(t,false);
}
function renderFlowDetail(t,note){
  const host=document.getElementById('flow-detail');
  const o=(R.options||{})[t];
  const head=`<div class="sec"> ${t} — FLOW & GEX
      <button class="chartbtn" onclick="openChart('${t}')">📈 CHART ↗</button>
      <button class="closebtn" onclick="closeFlowDetail()" title="close search result">✕ CLOSE</button>
      ${note?`<span style="font-size:10px;color:var(--t3);letter-spacing:0">${note}</span>`:''}</div>`;
  if(!o||o.error){
    const msg = o&&o.error ? `No options intel — ${o.error}. This can happen on names with sparse OI or fresh listings.`
                            : `No options data for ${t}.`;
    host.innerHTML = head + `<div class="card"><div class="empty">${msg}</div></div>`;
  } else {
    host.innerHTML = head + flowCard(t);
  }
}
async function openFlowDetail(t){
  t=(t||'').toUpperCase().trim();
  const host=document.getElementById('flow-detail');
  if(!t){host.innerHTML='';return;}
  const o=(R.options||{})[t];
  if(o&&!o.error){ renderFlowDetail(t); host.scrollIntoView({behavior:'smooth'}); return; }
  host.innerHTML=`<div class="card"><span class="tk">${t}</span>
      <div class="empty">Fetching options chain for ${t} … <span class="mono" style="color:var(--cyn)"></span></div></div>`;
  host.scrollIntoView({behavior:'smooth'});
  try{
    await enrich(t);
    renderFlowDetail(t,'· live lookup');
  }catch(err){
    const offline = String(err).includes('Failed to fetch')||String(err).includes('NetworkError');
    const msg = offline ? offlineMsg() : `Could not fetch options for ${t}: ${err.message}. Check the ticker symbol.`;
    host.innerHTML=`<div class="card"><span class="tk">${t}</span><div class="empty">${msg}</div></div>`;
  }
}
function doFlowSearch(ev){ if(ev.key==='Enter') openFlowDetail(ev.target.value); }
async function enrich(t){
  const res=await fetch('api/lookup?t='+encodeURIComponent(t));
  const j=await res.json();
  if(j.error) throw new Error(j.error);
  R.results[t]=j.result;
  if(j.options){ R.options=R.options||{}; R.options[t]=j.options; }
  return j;
}
async function openDetail(t){
  t=(t||'').toUpperCase().trim();
  const host=document.getElementById('detail');
  if(!t){host.innerHTML='';return;}
  setTab('desk');
  if(isComplete(t)){ renderDetail(t); host.scrollIntoView({behavior:'smooth'}); return; }
  const have=!!R.results[t];
  if(have) renderDetail(t,'· fetching options + fundamentals …');
  else host.innerHTML=`<div class="card"><span class="tk">${t}</span>
      <div class="empty">Analyzing ${t} — price history, options chains, fundamentals … <span class="mono" style="color:var(--cyn)"></span></div></div>`;
  host.scrollIntoView({behavior:'smooth'});
  try{
    await enrich(t);
    renderDetail(t,'· live lookup');
  }catch(err){
    const offline = String(err).includes('Failed to fetch')||String(err).includes('NetworkError');
    const msg = offline ? offlineMsg() : `Could not analyze ${t}: ${err.message}. Check the ticker symbol.`;
    const short = offline ? (IS_FILE?'· open via localhost for options/FA':'· options/FA unavailable (server not running)') : '· enrichment failed';
    if(have){ renderDetail(t, short); const h=document.getElementById('detail');
      h.insertAdjacentHTML('beforeend', `<div class="card" style="border-color:rgba(245,158,11,.5)"><div class="empty">${msg}</div></div>`); }
    else host.innerHTML=`<div class="card"><span class="tk">${t}</span><div class="empty">${msg}</div></div>`;
  }
}
function doSearch(ev){ if(ev.key==='Enter') openDetail(ev.target.value); }
function setTab(name){
  ['desk','watch','market','flow'].forEach(x=>{
    const v=document.getElementById('view-'+x); if(v) v.style.display=x===name?'block':'none';
    const tb=document.getElementById('tab-'+x); if(tb) tb.classList.toggle('on',x===name);});
  if(name==='watch') renderWatchTab();
}
